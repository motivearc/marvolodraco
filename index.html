<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        var path = location.pathname
        var admin = path === '/admin' || path.indexOf('/admin/') === 0
        var link = document.querySelector('link[rel="manifest"]')
        if (link) {
          link.setAttribute(
            'href',
            admin ? '/admin.webmanifest' : '/site.webmanifest',
          )
        }
        var appleTitle = document.querySelector(
          'meta[name="apple-mobile-web-app-title"]',
        )
        if (appleTitle) {
          appleTitle.setAttribute('content', admin ? 'Marvolo Admin' : 'Marvolo')
        }
        try {
          if (admin) sessionStorage.setItem('admin-manifest-ready', '1')
          else sessionStorage.removeItem('admin-manifest-ready')
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
